services:
  web:
    build:
      context: .
    image: chom-website
    container_name: chom-website
    ports:
      - "3000:3000"
    environment:
      # Destinataire des demandes de devis (adapter d'envoi stub) + email public.
      CONTACT_EMAIL: ${CONTACT_EMAIL:-pamahe@proton.me}
      DEVIS_RECIPIENT: ${DEVIS_RECIPIENT:-pamahe@proton.me}
      # Resend (email) — clé via .env / secret, jamais en dur.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-CHOM <onboarding@resend.dev>}
      # Repli si pas de Resend : URL de webhook (Slack, Make, email…).
      DEVIS_WEBHOOK_URL: ${DEVIS_WEBHOOK_URL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
